name: Gitpal Oracle studio validation
on:
  pull_request:
    paths:
      - 'index.html'
      - 'studio.mjs'
      - 'tests/studio.test.mjs'
      - '.github/workflows/gitpal-studio.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: node --check studio.mjs
      - name: Unit tests
        run: node --test tests/studio.test.mjs
      - name: No inline GitHub credential or direct GitHub write route
        run: |
          ! grep -nE 'github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{16,}|/repos/.+/merge' index.html studio.mjs
